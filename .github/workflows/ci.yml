name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: Validate Truth, Smoke Test & Astro Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 1. Install Dependencies
        run: npm ci

      - name: 2. Agent Truth & Blocker Check
        run: node scripts/agent-status.mjs

      - name: 3. Tool Runtime Smoke Tests (72 Tools)
        run: node scripts/smoke-test.mjs

      - name: 4. Sveltia CMS & Drift Check
        run: node scripts/check-cms-drift.mjs

      - name: 5. Content & Quality Checks
        run: node scripts/check-content.mjs

      - name: 6. Astro 7 Static Export Build
        run: npm run build

      - name: 7. Verify Dist Runtime Sync
        run: node scripts/build.mjs --check

      - name: 8. Verify Dist Output
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/tools/exif-strip/index.html
          test -f dist/admin/index.html
          echo "All static Astro artifacts verified successfully!"
